<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dondersの反応時間実験</title>

  <!-- jsPsych 8.3.0 -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">

  <style>
    body {
      background: white;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      line-height: 1.8;
      text-align: left;
      font-size: 21px;
    }
    .center {
      text-align: center;
    }
    .stimulus {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto;
    }
    .red {
      background: #e53935;
    }
    .blue {
      background: #1e88e5;
    }
    .fixation {
      font-size: 54px;
      font-weight: 400;
      line-height: 1;
    }
    .key {
      display: inline-block;
      min-width: 34px;
      padding: 2px 8px;
      border: 1px solid #888;
      border-radius: 5px;
      background: #f7f7f7;
      font-family: monospace;
      text-align: center;
    }
    table.results {
      border-collapse: collapse;
      margin: 24px auto;
      font-size: 21px;
    }
    table.results th, table.results td {
      border-bottom: 1px solid #bbb;
      padding: 9px 20px;
      text-align: right;
    }
    table.results th:first-child,
    table.results td:first-child {
      text-align: left;
    }
    .small {
      font-size: 17px;
      color: #555;
    }
    .good { color: #167c2c; font-weight: 700; }
    .bad  { color: #b3261e; font-weight: 700; }
  </style>
</head>

<body></body>

<script>
"use strict";

/* ============================================================
   Donders reaction-time demonstration
   Tasks:
     1. Simple RT
     2. Discrimination RT (Go/No-Go)
     3. Choice RT

   Main-trial counts are intentionally small for classroom use.
   ============================================================ */

const jsPsych = initJsPsych();

/* ---------- Settings ---------- */
const PRACTICE_SIMPLE = 3;
const PRACTICE_DISCRIMINATION = 4;
const PRACTICE_CHOICE = 4;

const MAIN_SIMPLE = 12;
const MAIN_DISCRIMINATION = 12;  // 6 red (Go), 6 blue (No-Go)
const MAIN_CHOICE = 12;          // 6 red, 6 blue

const RESPONSE_WINDOW = 1500;    // ms
const ITI_MIN = 600;             // fixation duration lower bound
const ITI_MAX = 1200;            // fixation duration upper bound

/* ---------- Helper functions ---------- */
function randomFixationDuration() {
  return Math.floor(Math.random() * (ITI_MAX - ITI_MIN + 1)) + ITI_MIN;
}

function shuffled(array) {
  return jsPsych.randomization.shuffle(array.slice());
}

function circle(color) {
  return `<div class="stimulus ${color}"></div>`;
}

function fixationTrial(task, phase) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: randomFixationDuration(),
    data: {
      record_type: "fixation",
      task: task,
      phase: phase
    }
  };
}

function feedbackTrial(message, correct) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="center ${correct ? "good" : "bad"}">${message}</div>`,
    choices: "NO_KEYS",
    trial_duration: 500,
    data: { record_type: "feedback" }
  };
}

function mean(arr) {
  if (arr.length === 0) return NaN;
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function fmt(x) {
  return Number.isFinite(x) ? `${Math.round(x)} ms` : "—";
}

/* ---------- Participant ID ---------- */
const participantId =
  jsPsych.data.getURLVariable("participant") ||
  jsPsych.randomization.randomID(8);

jsPsych.data.addProperties({
  participant_id: participantId,
  experiment: "Donders_class_demo",
  jspsych_version: "8.3.0"
});

/* ---------- Timeline ---------- */
const timeline = [];

/* Welcome */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap">
      <h2 class="center">Dondersの反応時間実験</h2>
      <p>
        この実験では、3種類の反応時間課題を行います。
        できるだけ<strong>速く、かつ正確に</strong>反応してください。
      </p>
      <p>
        1. 単純反応時間課題<br>
        2. 弁別反応時間課題（Go/No-Go）<br>
        3. 選択反応時間課題
      </p>
      <p class="small">
        このページだけではデータは教員側へ自動送信されません。
        最後に自分の結果を確認し、必要ならCSVファイルを保存できます。
      </p>
      <p class="center">準備ができたら <span class="key">Space</span> を押してください。</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", screen: "welcome" }
});

/* ============================================================
   1. SIMPLE RT
   ============================================================ */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap">
      <h2 class="center">1．単純反応時間課題</h2>
      <p>
        画面中央に丸が現れたら、色に関係なく、
        できるだけ速く <span class="key">Space</span> を押してください。
      </p>
      <p class="center">まず練習を ${PRACTICE_SIMPLE} 試行行います。</p>
      <p class="center"><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "simple" }
});

for (let i = 0; i < PRACTICE_SIMPLE; i++) {
  timeline.push(fixationTrial("simple", "practice"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(i % 2 === 0 ? "red" : "blue"),
    choices: [" "],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: true,
    data: {
      record_type: "response",
      task: "simple",
      phase: "practice",
      stimulus_color: i % 2 === 0 ? "red" : "blue",
      correct_response: " "
    },
    on_finish: function(data) {
      data.correct = data.response === " ";
    }
  });
}

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap center">
      <p>練習は終了です。</p>
      <p>ここから本試行を ${MAIN_SIMPLE} 試行行います。</p>
      <p><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "simple", phase: "main" }
});

for (let i = 0; i < MAIN_SIMPLE; i++) {
  const color = i % 2 === 0 ? "red" : "blue";
  timeline.push(fixationTrial("simple", "main"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(color),
    choices: [" "],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: true,
    data: {
      record_type: "response",
      task: "simple",
      phase: "main",
      stimulus_color: color,
      correct_response: " "
    },
    on_finish: function(data) {
      data.correct = data.response === " ";
    }
  });
}

/* ============================================================
   2. DISCRIMINATION RT (Go/No-Go)
   ============================================================ */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap">
      <h2 class="center">2．弁別反応時間課題</h2>
      <p>
        <strong>赤い丸</strong>が出たときだけ
        <span class="key">Space</span> を押してください。
      </p>
      <p>
        <strong>青い丸</strong>が出たときは、何も押さずに待ってください。
      </p>
      <p class="center">まず練習を ${PRACTICE_DISCRIMINATION} 試行行います。</p>
      <p class="center"><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "discrimination" }
});

const discrPractice = shuffled(["red", "red", "blue", "blue"]);
discrPractice.forEach(color => {
  timeline.push(fixationTrial("discrimination", "practice"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(color),
    choices: [" "],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: color === "red",
    data: {
      record_type: "response",
      task: "discrimination",
      phase: "practice",
      stimulus_color: color,
      trial_role: color === "red" ? "go" : "nogo",
      correct_response: color === "red" ? " " : "none"
    },
    on_finish: function(data) {
      if (data.stimulus_color === "red") {
        data.correct = data.response === " ";
      } else {
        data.correct = data.response === null;
      }
    }
  });
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap center">
      <p>練習は終了です。</p>
      <p>ここから本試行を ${MAIN_DISCRIMINATION} 試行行います。</p>
      <p><strong>赤：Space　／　青：押さない</strong></p>
      <p><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "discrimination", phase: "main" }
});

const discrMain = shuffled([
  "red","red","red","red","red","red",
  "blue","blue","blue","blue","blue","blue"
]);

discrMain.forEach(color => {
  timeline.push(fixationTrial("discrimination", "main"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(color),
    choices: [" "],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: color === "red",
    data: {
      record_type: "response",
      task: "discrimination",
      phase: "main",
      stimulus_color: color,
      trial_role: color === "red" ? "go" : "nogo",
      correct_response: color === "red" ? " " : "none"
    },
    on_finish: function(data) {
      if (data.stimulus_color === "red") {
        data.correct = data.response === " ";
      } else {
        data.correct = data.response === null;
      }
    }
  });
});

/* ============================================================
   3. CHOICE RT
   ============================================================ */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap">
      <h2 class="center">3．選択反応時間課題</h2>
      <p>
        丸の色に応じて、次のキーをできるだけ速く正確に押してください。
      </p>
      <p class="center">
        <strong>赤い丸</strong> → <span class="key">F</span><br>
        <strong>青い丸</strong> → <span class="key">J</span>
      </p>
      <p class="center">まず練習を ${PRACTICE_CHOICE} 試行行います。</p>
      <p class="center"><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "choice" }
});

const choicePractice = shuffled(["red", "red", "blue", "blue"]);
choicePractice.forEach(color => {
  const correctKey = color === "red" ? "f" : "j";
  timeline.push(fixationTrial("choice", "practice"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(color),
    choices: ["f", "j"],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: true,
    data: {
      record_type: "response",
      task: "choice",
      phase: "practice",
      stimulus_color: color,
      correct_response: correctKey
    },
    on_finish: function(data) {
      data.correct = data.response === data.correct_response;
    }
  });
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap center">
      <p>練習は終了です。</p>
      <p>ここから本試行を ${MAIN_CHOICE} 試行行います。</p>
      <p><strong>赤：F　／　青：J</strong></p>
      <p><span class="key">Space</span> で開始</p>
    </div>`,
  choices: [" "],
  data: { record_type: "instruction", task: "choice", phase: "main" }
});

const choiceMain = shuffled([
  "red","red","red","red","red","red",
  "blue","blue","blue","blue","blue","blue"
]);

choiceMain.forEach(color => {
  const correctKey = color === "red" ? "f" : "j";
  timeline.push(fixationTrial("choice", "main"));
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: circle(color),
    choices: ["f", "j"],
    trial_duration: RESPONSE_WINDOW,
    response_ends_trial: true,
    data: {
      record_type: "response",
      task: "choice",
      phase: "main",
      stimulus_color: color,
      correct_response: correctKey
    },
    on_finish: function(data) {
      data.correct = data.response === data.correct_response;
    }
  });
});

/* ============================================================
   RESULTS
   ============================================================ */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    const allMain = jsPsych.data.get()
      .filter({ record_type: "response", phase: "main" });

    const simpleCorrect = allMain
      .filter({ task: "simple", correct: true })
      .select("rt").values
      .filter(x => x !== null);

    // For discrimination RT, use only correct Go trials.
    const discriminationCorrectGo = allMain
      .filter({
        task: "discrimination",
        trial_role: "go",
        correct: true
      })
      .select("rt").values
      .filter(x => x !== null);

    const choiceCorrect = allMain
      .filter({ task: "choice", correct: true })
      .select("rt").values
      .filter(x => x !== null);

    const simpleRT = mean(simpleCorrect);
    const discrRT = mean(discriminationCorrectGo);
    const choiceRT = mean(choiceCorrect);

    const discriminationTime =
      Number.isFinite(simpleRT) && Number.isFinite(discrRT)
        ? discrRT - simpleRT
        : NaN;

    const responseSelectionTime =
      Number.isFinite(discrRT) && Number.isFinite(choiceRT)
        ? choiceRT - discrRT
        : NaN;

    const discrAll = allMain.filter({ task: "discrimination" });
    const discrCorrectN = discrAll.filter({ correct: true }).count();
    const discrAccuracy = 100 * discrCorrectN / discrAll.count();

    const choiceAll = allMain.filter({ task: "choice" });
    const choiceCorrectN = choiceAll.filter({ correct: true }).count();
    const choiceAccuracy = 100 * choiceCorrectN / choiceAll.count();

    // Store summary in the dataset.
    jsPsych.data.write({
      record_type: "summary",
      participant_id: participantId,
      simple_rt_mean: simpleRT,
      discrimination_rt_mean_go: discrRT,
      choice_rt_mean: choiceRT,
      donders_discrimination_time: discriminationTime,
      donders_response_selection_time: responseSelectionTime,
      discrimination_accuracy: discrAccuracy,
      choice_accuracy: choiceAccuracy
    });

    return `
      <div class="wrap">
        <h2 class="center">結果</h2>

        <table class="results">
          <tr>
            <th>課題</th>
            <th>平均反応時間</th>
          </tr>
          <tr>
            <td>単純反応時間</td>
            <td>${fmt(simpleRT)}</td>
          </tr>
          <tr>
            <td>弁別反応時間</td>
            <td>${fmt(discrRT)}</td>
          </tr>
          <tr>
            <td>選択反応時間</td>
            <td>${fmt(choiceRT)}</td>
          </tr>
        </table>

        <h3 class="center">Dondersの減算法</h3>
        <table class="results">
          <tr>
            <td>弁別に対応する時間<br>
              <span class="small">弁別RT − 単純RT</span>
            </td>
            <td>${fmt(discriminationTime)}</td>
          </tr>
          <tr>
            <td>反応選択に対応する時間<br>
              <span class="small">選択RT − 弁別RT</span>
            </td>
            <td>${fmt(responseSelectionTime)}</td>
          </tr>
        </table>

        <p class="center small">
          弁別課題の正答率：${Math.round(discrAccuracy)}％　
          選択課題の正答率：${Math.round(choiceAccuracy)}％
        </p>

        <p class="small">
          ※ 弁別反応時間は、赤刺激に正しく反応したGo試行のみから算出しています。<br>
          ※ Dondersの減算法は、各処理段階の時間が加算的であるという仮定に基づく古典的な考え方です。
          この値を各心理過程の「純粋な所要時間」と厳密にみなすものではありません。
        </p>

        <p class="center">
          CSVを保存する場合：<span class="key">S</span><br>
          保存せず終了する場合：<span class="key">Enter</span>
        </p>
      </div>`;
  },
  choices: ["s", "Enter"],
  data: { record_type: "results_screen" },
  on_finish: function(data) {
    if (data.response === "s") {
      jsPsych.data.get().localSave(
        "csv",
        `donders_${participantId}.csv`
      );
    }
  }
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div class="wrap center">
      <h2>実験は終了です。</h2>
      <p>ご協力ありがとうございました。</p>
    </div>`,
  choices: "NO_KEYS",
  trial_duration: 3000,
  data: { record_type: "end" }
});

jsPsych.run(timeline);
</script>
</html>
